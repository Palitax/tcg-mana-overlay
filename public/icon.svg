<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Glowing Loop Arrow Circle -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer Loop Ring -->
    <path d="M -110,0 A 110,110 0 1,1 80,75" fill="none" stroke="url(#glowGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Arrowhead -->
    <polygon points="60,105 110,80 75,30" fill="url(#glowGrad)"/>

    <!-- Play Icon Center -->
    <polygon points="-25,-40 -25,40 45,0" fill="#ffffff"/>
  </g>
</svg>
