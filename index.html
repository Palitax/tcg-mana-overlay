<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mana Overlay">
  <meta name="theme-color" content="#030305">
  <meta name="description" content="High-End Glowing Mana Aura Overlay Web App for TCG Cards on iPad">
  
  <title>TCG Mana Overlay | iPad Streamer</title>
  
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Canvas Container for PixiJS WebGL Renderer -->
  <div id="canvas-container"></div>

  <!-- Interactive Visual Overlay Guides (Visible when unlocked) -->
  <div id="touch-guide" class="touch-guide">
    <div class="card-outline-hint">
      <div class="corner-indicator top-left"></div>
      <div class="corner-indicator top-right"></div>
      <div class="corner-indicator bottom-left"></div>
      <div class="corner-indicator bottom-right"></div>
      <div class="card-center-cross"></div>
    </div>
  </div>

  <!-- Sleek Floating HUD / Controls Overlay -->
  <main id="ui-overlay" class="ui-overlay">
    
    <!-- Top Bar: Status, Lock Button, Collapsible Toggle -->
    <header class="hud-header">
      <div class="brand">
        <div class="mana-orb" id="brand-orb"></div>
        <div class="brand-text">
          <h1>MANA OVERLAY</h1>
          <span class="sub-badge" id="status-badge">UNLOCKED</span>
        </div>
      </div>

      <div class="top-actions">
        <div class="fps-pill" id="fps-meter" title="Current FPS">60 FPS</div>
        
        <button id="btn-lock" class="btn btn-lock" title="Lock frame position">
          <svg class="icon lock-open-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
          <svg class="icon lock-closed-icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span id="lock-btn-label">LOCK</span>
        </button>

        <button id="btn-toggle-hud" class="btn btn-icon" title="Toggle UI Controls">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Settings Panel Drawer -->
    <div id="hud-panel" class="hud-panel">

      <!-- Preset Selection Grid -->
      <section class="control-group">
        <label class="group-title">CARD PRESETS</label>
        <div class="preset-buttons">
          <button class="btn-preset active" data-preset="toploader">
            <span class="preset-name">Toploader</span>
            <span class="preset-ratio">3" × 4"</span>
          </button>
          <button class="btn-preset" data-preset="standard">
            <span class="preset-name">Standard</span>
            <span class="preset-ratio">MTG / Pokémon</span>
          </button>
          <button class="btn-preset" data-preset="japanese">
            <span class="preset-name">Japanese</span>
            <span class="preset-ratio">Yu-Gi-Oh!</span>
          </button>
          <button class="btn-preset" data-preset="oversized">
            <span class="preset-name">Commander</span>
            <span class="preset-ratio">Oversized</span>
          </button>
        </div>
      </section>

      <!-- Color Theme Selector -->
      <section class="control-group">
        <label class="group-title">ELEMENTAL THEME</label>
        <div class="theme-picker">
          <button class="btn-theme active" data-theme="blue" style="--theme-c1: #00f2ff; --theme-c2: #0044ff;">
            <span class="theme-swatch"></span>
            <span>Blue Mana</span>
          </button>
          <button class="btn-theme" data-theme="red" style="--theme-c1: #ff4400; --theme-c2: #ff9900;">
            <span class="theme-swatch"></span>
            <span>Dragon Fire</span>
          </button>
          <button class="btn-theme" data-theme="green" style="--theme-c1: #00ff88; --theme-c2: #00aa44;">
            <span class="theme-swatch"></span>
            <span>Emerald Life</span>
          </button>
          <button class="btn-theme" data-theme="purple" style="--theme-c1: #b000ff; --theme-c2: #6600ff;">
            <span class="theme-swatch"></span>
            <span>Void Energy</span>
          </button>
          <button class="btn-theme" data-theme="gold" style="--theme-c1: #ffcc00; --theme-c2: #ff8800;">
            <span class="theme-swatch"></span>
            <span>Holy Sun</span>
          </button>
        </div>
      </section>

      <!-- Sliders for Fine Tuning -->
      <section class="control-group sliders-grid">
        <div class="slider-item">
          <div class="slider-header">
            <span>Glow Intensity</span>
            <span id="val-glow" class="slider-val">1.4x</span>
          </div>
          <input type="range" id="slider-glow" min="0.4" max="3.0" step="0.1" value="1.4">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span>Border Thickness</span>
            <span id="val-thickness" class="slider-val">32px</span>
          </div>
          <input type="range" id="slider-thickness" min="12" max="64" step="2" value="32">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span>Aura Turbulence</span>
            <span id="val-speed" class="slider-val">1.0x</span>
          </div>
          <input type="range" id="slider-speed" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="slider-item">
          <div class="slider-header">
            <span>Corner Radius</span>
            <span id="val-radius" class="slider-val">24px</span>
          </div>
          <input type="range" id="slider-radius" min="4" max="48" step="2" value="24">
        </div>
      </section>

      <!-- Micro Adjustments & Transformations -->
      <section class="control-group transform-controls">
        <label class="group-title">TRANSFORM & ALIGNMENT</label>
        <div class="transform-actions">
          <button id="btn-center" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="2" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
            </svg>
            Center Frame
          </button>
          
          <button id="btn-rotate-90" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            Rotate 90°
          </button>

          <button id="btn-reset" class="btn btn-danger">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            Reset All
          </button>
        </div>
      </section>

      <!-- Gesture Helper Footer -->
      <footer class="hud-footer">
        <div class="gesture-tip">
          <span class="tip-icon">👇</span> 1-finger: Drag move
        </div>
        <div class="gesture-tip">
          <span class="tip-icon">🤏</span> 2-finger: Pinch scale & rotate
        </div>
        <div class="gesture-tip">
          <span class="tip-icon">🔒</span> Lock when aligned
        </div>
      </footer>

    </div>
  </main>

  <!-- Minimal Floating Quick Unlock Button (Shown when HUD is hidden / Locked) -->
  <button id="floating-unlock" class="floating-unlock hidden" title="Unlock Frame / Show Controls">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>UNLOCK</span>
  </button>

  <!-- App Entry Point -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
